[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-manifold3d"
version = "0.1.0"
description = "Watertight mesh CSG and convex geometry with Mojo kernels"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
